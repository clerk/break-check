name: "Break Check"
description: "Detect API breaking changes in TypeScript packages on every PR."
author: "Clerk"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  config-path:
    description: "Path to break-check.config.json, relative to the repository root."
    required: false
    default: "break-check.config.json"
  base-ref:
    description: |
      Git ref or commit SHA to compare against. Defaults to the pull request
      base SHA (`github.event.pull_request.base.sha`) so PRs are diffed
      against the exact commit they were opened against, not the moving tip
      of the base branch.
    required: false
    default: ${{ github.event.pull_request.base.sha || github.base_ref }}
  head-ref:
    description: |
      Git ref or commit SHA to treat as the "current" side of the diff.
      Defaults to the pull request head SHA (`github.event.pull_request.head.sha`)
      so the comparison is pinned to the exact commits the PR introduces, not
      the `refs/pull/N/merge` ref that `actions/checkout` resolves by default.
      That merge ref is the PR head merged into the moving tip of the base
      branch, so it leaks unrelated base-branch changes into the report once
      the base branch advances. When empty (non pull_request events), the
      action builds the checked-out workspace as-is.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  setup-command:
    description: |
      Shell command break-check runs inside both the base-ref checkout and the
      current checkout to install dependencies and build .d.ts files.
    required: false
    default: "pnpm install --frozen-lockfile && pnpm build"
  break-check-version:
    description: |
      Version of @clerk/break-check to fetch with `npx`. Requires >= 0.1.1, since
      this revision calls `detect --json-output`. The default `latest` resolves
      to a compatible version.
    required: false
    default: "latest"
  baseline-artifact-name:
    description: |
      Name of a baseline snapshot artifact uploaded from a push-to-`base-ref`
      workflow. When set, the Action downloads the most recent matching
      artifact instead of rebuilding `base-ref`. Falls back to the worktree
      rebuild if no usable artifact is found. Requires `actions:read` on
      `github-token` (the default `github.token` has it).
    required: false
    default: ""
  baseline-max-age:
    description: |
      Maximum age, in hours, for a downloaded baseline artifact before the
      Action falls back to a fresh worktree rebuild. Default unset (no
      maximum). Only applies when `baseline-artifact-name` is set.
    required: false
    default: ""
  comment:
    description: "Post (or update) a PR comment with the report."
    required: false
    default: "true"
  report-artifact-name:
    description: |
      Name for the uploaded report artifact. Artifact names are immutable and
      global to a workflow run, so when this Action runs more than once per
      run (a matrix, or per-package jobs) the default name collides and the
      second upload fails. Give each invocation a distinct name, e.g. append
      the matrix package name: `break-check-report-pkg-a`. (The runner
      template-parses expression syntax anywhere in this manifest, so an
      expression cannot be written literally here.)
    required: false
    default: "break-check-report"
  fail-on-breaking:
    description: "Fail the workflow when breaking changes are detected."
    required: false
    default: "false"
  policy-mode:
    description: |
      Enforce the break-check config from the base ref instead of the PR head.
      Without this, a PR can edit its own break-check.config.json (drop the
      changed package, add an `acknowledgedChanges` entry, widen
      `ignoreSubpaths`/`resolvableSpecifiers`) to suppress detection of its own
      breaking change. With policy-mode on, the config is taken from the base
      ref before the diff runs, so a config change only takes effect once it has
      landed on the base branch. Recommended when this Action is a required
      merge gate. A base ref that has no config yet (the PR introducing
      break-check) falls back to the PR config.
    required: false
    default: "false"
  anthropic-api-key:
    description: |
      Anthropic API key. When set, break-check routes the rule-based diff
      through Claude for a second opinion: it escalates changes the rule pass
      under-classified and adds a migration hint per breaking change. By default
      the AI only records its breaking->non-breaking downgrades as suggestions
      and cannot clear a real break; turn `ai.applyDowngrades` on in
      break-check.config.json to act on them. Leave empty to run the
      deterministic rule-based diff only. Always pass this from a secret, never
      inline.
    required: false
    default: ""
  github-token:
    description: "Token used to read existing comments and post the report."
    required: false
    default: ${{ github.token }}

outputs:
  has-breaking-changes:
    description: "true if break-check detected at least one breaking change."
    value: ${{ steps.detect.outputs.has-breaking-changes }}
  report-path:
    description: "Path to the generated markdown report."
    value: ${{ steps.detect.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Validate runtime context
      shell: bash
      run: |
        if [ -z "${BASE_REF:-}" ]; then
          echo "::error::base-ref is empty. Run this action on pull_request events, or pass base-ref explicitly."
          exit 1
        fi
        if [ ! -f "$CONFIG_PATH" ]; then
          echo "::error::config-path '$CONFIG_PATH' does not exist in the current checkout."
          exit 1
        fi
      env:
        BASE_REF: ${{ inputs.base-ref }}
        CONFIG_PATH: ${{ inputs.config-path }}

    - name: Try fetching baseline artifact
      id: fetch-baseline
      if: inputs.baseline-artifact-name != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_REF: ${{ inputs.base-ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ARTIFACT_NAME: ${{ inputs.baseline-artifact-name }}
        MAX_AGE_HOURS: ${{ inputs.baseline-max-age }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        BASELINE_DIR="$RUNNER_TEMP/break-check-baseline"

        fallback() {
          echo "::notice::$1 Falling back to base-ref rebuild."
          echo "fetched=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # On pull_request events, bind the baseline to the PR's exact base commit
        # by matching the producing run's head_sha against base.sha. Selecting by
        # branch name alone grabs the newest snapshot on that branch, which can be
        # ahead of (or behind) the commit the PR was actually opened against, so
        # the diff would compare against a tree the PR never saw. Fall back to
        # branch matching only when no base SHA is available (non-PR events).
        if [ -n "${BASE_SHA:-}" ]; then
          SELECT="select(.workflow_run.head_sha == \"$BASE_SHA\" and .expired == false)"
        else
          SELECT="select(.workflow_run.head_branch == \"$BASE_REF\" and .expired == false)"
        fi
        ARTIFACT=$(gh api \
          "repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
          --jq "[.artifacts[] | $SELECT] | .[0]") \
          || fallback "Artifact lookup failed."

        if [ -z "$ARTIFACT" ] || [ "$ARTIFACT" = "null" ]; then
          fallback "No baseline artifact '$ARTIFACT_NAME' for base '${BASE_SHA:-$BASE_REF}'."
        fi

        ARTIFACT_ID=$(echo "$ARTIFACT" | jq -r '.id')
        CREATED_AT=$(echo "$ARTIFACT" | jq -r '.created_at')
        RUN_ID=$(echo "$ARTIFACT" | jq -r '.workflow_run.id')

        if [ -n "$MAX_AGE_HOURS" ]; then
          AGE_SECONDS=$(( $(date -u +%s) - $(date -u -d "$CREATED_AT" +%s) ))
          MAX_AGE_SECONDS=$(( MAX_AGE_HOURS * 3600 ))
          if [ "$AGE_SECONDS" -gt "$MAX_AGE_SECONDS" ]; then
            fallback "Baseline artifact older than $MAX_AGE_HOURS hours."
          fi
        fi

        rm -rf "$BASELINE_DIR"
        mkdir -p "$BASELINE_DIR"
        ZIP_PATH="$RUNNER_TEMP/break-check-baseline.zip"
        gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP_PATH" \
          || fallback "Artifact download failed."
        unzip -q "$ZIP_PATH" -d "$BASELINE_DIR" \
          || fallback "Artifact unzip failed."
        rm -f "$ZIP_PATH"

        echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
        echo "fetched=true" >> "$GITHUB_OUTPUT"
        echo "::notice::Using baseline artifact '$ARTIFACT_NAME' from run $RUN_ID."

    - name: Snapshot baseline from ${{ inputs.base-ref }}
      if: steps.fetch-baseline.outputs.fetched != 'true'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        CONFIG_PATH: ${{ inputs.config-path }}
        SETUP_COMMAND: ${{ inputs.setup-command }}
        BREAK_CHECK_VERSION: ${{ inputs.break-check-version }}
      run: |
        set -euo pipefail
        BASELINE_DIR="$RUNNER_TEMP/break-check-baseline"
        BASE_CHECKOUT="$RUNNER_TEMP/break-check-base-checkout"
        rm -rf "$BASELINE_DIR" "$BASE_CHECKOUT"

        # base-ref may be a branch name ("main") or a commit SHA (the PR's
        # base.sha). We want the exact commit either way, not the current
        # tip of a moving branch. Resolve in two passes:
        #   1. If BASE_REF already names a reachable object locally (full
        #      clone + the SHA is in history, or a tracked branch tip is
        #      already updated), skip the fetch entirely. This is the
        #      common case when the caller used `actions/checkout` with
        #      `fetch-depth: 0` and `persist-credentials: false`, where a
        #      subsequent unauthenticated fetch would prompt for creds.
        #   2. Otherwise, fetch the ref and pin to FETCH_HEAD.
        if git rev-parse --verify --quiet "$BASE_REF^{commit}" > /dev/null; then
          BASE_TARGET="$BASE_REF"
        else
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_TARGET="FETCH_HEAD"
        fi
        git worktree add --detach "$BASE_CHECKOUT" "$BASE_TARGET"

        # If the base ref doesn't have a break-check config yet (e.g. the PR is the
        # one introducing break-check), seed it from the current checkout so the
        # first run still produces a usable baseline.
        if [ ! -f "$BASE_CHECKOUT/$CONFIG_PATH" ]; then
          mkdir -p "$BASE_CHECKOUT/$(dirname "$CONFIG_PATH")"
          cp "$CONFIG_PATH" "$BASE_CHECKOUT/$CONFIG_PATH"
        fi

        (
          cd "$BASE_CHECKOUT"
          bash -c "$SETUP_COMMAND"
          npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" snapshot \
            --config "$CONFIG_PATH" \
            --output "$BASELINE_DIR"
        )

        echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
        echo "BASE_CHECKOUT=$BASE_CHECKOUT" >> "$GITHUB_ENV"

    - name: Build current checkout
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head-ref }}
        SETUP_COMMAND: ${{ inputs.setup-command }}
      run: |
        set -euo pipefail

        # The "current" side of the diff must be the PR head, not the
        # refs/pull/N/merge ref that actions/checkout resolves by default on
        # pull_request events. That merge ref is the PR head merged into the
        # *current* tip of the base branch, so once the base branch advances it
        # silently absorbs unrelated changes and break-check reports them as the
        # PR's own (issue #32). When a head ref is available, build it in an
        # isolated worktree (symmetric with the baseline above) so the result
        # never depends on how the caller checked out and the caller's workspace
        # is left untouched.
        if [ -n "${HEAD_REF:-}" ]; then
          HEAD_CHECKOUT="$RUNNER_TEMP/break-check-head-checkout"
          rm -rf "$HEAD_CHECKOUT"

          # Resolve to the exact commit, preferring local history so a
          # fetch-depth: 0 + persist-credentials: false checkout doesn't trigger
          # an unauthenticated fetch (mirrors the baseline step).
          if git rev-parse --verify --quiet "$HEAD_REF^{commit}" > /dev/null; then
            HEAD_TARGET="$HEAD_REF"
          else
            git fetch --no-tags --depth=1 origin "$HEAD_REF"
            HEAD_TARGET="FETCH_HEAD"
          fi
          git worktree add --detach "$HEAD_CHECKOUT" "$HEAD_TARGET"

          (
            cd "$HEAD_CHECKOUT"
            bash -c "$SETUP_COMMAND"
          )
          echo "CURRENT_DIR=$HEAD_CHECKOUT" >> "$GITHUB_ENV"
        else
          # No head ref (non pull_request event): build the workspace the caller
          # checked out and diff that.
          bash -c "$SETUP_COMMAND"
          echo "CURRENT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        fi

    - name: Enforce base-ref config (policy mode)
      if: inputs.policy-mode == 'true'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail

        # The break-check config is part of the surface a PR can edit, so a PR
        # could drop its own changed package, acknowledge its own break, or
        # widen ignoreSubpaths/resolvableSpecifiers to green a breaking change
        # (issue #1). In policy mode, take the config from the base ref and
        # overwrite the head copy in place, so a config change only counts once
        # it has landed on the base branch. Writing it over CONFIG_PATH (rather
        # than pointing --config elsewhere) keeps the relative `packages` paths
        # resolving against the PR head checkout in CURRENT_DIR.

        # Resolve the base ref to a commit, preferring local history so a
        # fetch-depth: 0 + persist-credentials: false checkout doesn't trigger
        # an unauthenticated fetch (mirrors the baseline/head steps).
        if git rev-parse --verify --quiet "$BASE_REF^{commit}" > /dev/null; then
          BASE_TARGET="$BASE_REF"
        else
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_TARGET="FETCH_HEAD"
        fi

        if git cat-file -e "$BASE_TARGET:$CONFIG_PATH" 2>/dev/null; then
          mkdir -p "$CURRENT_DIR/$(dirname "$CONFIG_PATH")"
          git show "$BASE_TARGET:$CONFIG_PATH" > "$CURRENT_DIR/$CONFIG_PATH"
          echo "::notice::policy-mode: enforcing break-check config from base ref '$BASE_REF'."
        else
          # Base ref has no config yet (e.g. the PR introduces break-check).
          # There is no established policy to enforce, so keep the PR config.
          echo "::notice::policy-mode: base ref '$BASE_REF' has no '$CONFIG_PATH'; using the PR config (first run)."
        fi

    - name: Detect API changes
      id: detect
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        BREAK_CHECK_VERSION: ${{ inputs.break-check-version }}
        FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        # Forwarded to the detect subprocess. Empty (the default) leaves the AI
        # reviewer off: the CLI treats an empty key as "not set". The key is set
        # only on this step, so the snapshot/build steps never see it.
        BREAK_CHECK_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -uo pipefail
        REPORT_PATH="$RUNNER_TEMP/break-check-report.md"
        JSON_PATH="$RUNNER_TEMP/break-check-report.json"

        # Run the diff from the current checkout resolved in the previous step
        # (the PR head worktree, or the workspace for non-PR events). CONFIG_PATH
        # is relative to this directory; BASELINE_DIR/REPORT_PATH/JSON_PATH are
        # absolute, so they resolve the same regardless of cwd.
        cd "$CURRENT_DIR"

        # One detect run emits both the human report (--output) and the
        # machine-readable verdict (--json-output) from a single analysis.
        # Running detect once per format would re-invoke the AI reviewer, which
        # both doubles its cost and lets the two passes disagree, so the posted
        # comment could contradict has-breaking-changes.
        run_detect() {
          npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" detect \
            --config "$CONFIG_PATH" \
            --baseline "$BASELINE_DIR" \
            --output "$REPORT_PATH" \
            --json-output "$JSON_PATH"
        }

        # detect exits 3 when it refuses the baseline as incompatible with this
        # break-check (API Extractor major or discovery version mismatch). Rebuild
        # the baseline from the base ref with this break-check so both sides match,
        # then retry once. The rebuild needs the base worktree, which only exists
        # when the baseline was built locally; a downloaded artifact baseline has
        # none, so surface a clear pin-your-versions error instead of dereferencing
        # an unset path.
        status=0
        run_detect || status=$?
        if [ "$status" = "3" ]; then
          if [ -z "${BASE_CHECKOUT:-}" ]; then
            echo "::error::break-check refused the downloaded baseline artifact as incompatible with break-check-version '$BREAK_CHECK_VERSION'. Pin the same break-check-version in the baseline producer and this check."
            exit 1
          fi
          echo "::notice::break-check refused the baseline as incompatible; rebuilding it from the base ref with this break-check and retrying."
          rm -rf "$BASELINE_DIR"
          (
            cd "$BASE_CHECKOUT"
            npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" snapshot \
              --config "$CONFIG_PATH" \
              --output "$BASELINE_DIR"
          )
          status=0
          run_detect || status=$?
        fi
        if [ "$status" = "3" ]; then
          echo "::error::break-check refused the baseline as incompatible even after rebuilding it from the base ref. The snapshot-time and detect-time break-check versions likely differ; pin a single break-check-version."
          exit 1
        fi
        if [ "$status" != "0" ]; then
          echo "::error::break-check detect failed (exit $status)."
          exit "$status"
        fi

        # has-breaking-changes comes from the JSON sidecar the single run wrote.
        # Fail closed: a missing or unparseable report must not default the flag
        # to false and let fail-on-breaking pass on a real break.
        if [ ! -s "$JSON_PATH" ]; then
          echo "::error::break-check produced no JSON report at $JSON_PATH; refusing to emit a fail-open result."
          exit 1
        fi
        HAS_BREAKING=$(node -e "
          const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf-8'));
          process.stdout.write(r.hasBreakingChanges ? 'true' : 'false');
        " "$JSON_PATH") || {
          echo "::error::Could not parse break-check JSON report at $JSON_PATH."
          exit 1
        }

        echo "has-breaking-changes=$HAS_BREAKING" >> "$GITHUB_OUTPUT"
        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

        if [ "$FAIL_ON_BREAKING" = "true" ] && [ "$HAS_BREAKING" = "true" ]; then
          echo "::error::Breaking API changes detected."
          exit 1
        fi

    - name: Upload break-check report
      # Always upload (even when fail-on-breaking failed the run) so the comment
      # can link the full report when it has to truncate. Skip only when detect
      # never produced one.
      if: always() && steps.detect.outputs.report-path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ steps.detect.outputs.report-path }}
        if-no-files-found: ignore
        retention-days: 5

    - name: Comment on PR
      # Always comment, including when fail-on-breaking failed the run, so a
      # blocked PR still shows why. The script no-ops when there is no report.
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_PATH: ${{ steps.detect.outputs.report-path }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ARTIFACT_NAME: ${{ inputs.report-artifact-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const reportPath = process.env.REPORT_PATH;
          if (!reportPath || !fs.existsSync(reportPath)) {
            core.warning(`break-check report not found at ${reportPath || '(unset)'}; skipping comment.`);
            return;
          }
          // One comment per invocation. A custom artifact name (matrix /
          // per-package runs) gets its own marker so parallel invocations
          // update their own comments instead of clobbering one. The default
          // keeps the historical marker so existing comments are still found
          // and updated rather than duplicated.
          const artifactName = process.env.ARTIFACT_NAME || 'break-check-report';
          const marker = artifactName === 'break-check-report'
            ? '<!-- break-check-action -->'
            : `<!-- break-check-action:${artifactName} -->`;
          const report = fs.readFileSync(reportPath, 'utf-8');

          // GitHub rejects issue-comment bodies over 65536 characters. Stay under
          // that and, when the report is larger, truncate and point at the full
          // report uploaded as an artifact on this run.
          const LIMIT = 64000;
          const head = `${marker}\n`;
          let body;
          if (head.length + report.length <= LIMIT) {
            body = head + report;
          } else {
            const notice =
              `\n\n> **Note**\n> Report truncated to fit GitHub's comment limit. ` +
              `The full report is attached as the \`${artifactName}\` artifact on ` +
              `[this run](${process.env.RUN_URL}).\n`;
            const budget = LIMIT - head.length - notice.length;
            body = head + report.slice(0, budget) + notice;
          }

          // Stamp the head SHA the report ran on, so a reviewer can tell whether
          // the comment reflects the current push.
          const ranSha = (process.env.HEAD_SHA || '').slice(0, 7);
          if (ranSha) {
            body += `\n\n<sub>Last ran on \`${ranSha}\`.</sub>`;
          }

          // Paginate: on a busy PR the existing bot comment can be past the first
          // page, and missing it would post a duplicate instead of updating it.
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(
            (c) => c.user?.type === 'Bot' && c.body && c.body.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
