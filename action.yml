name: "Break Check"
description: "Detect API breaking changes in TypeScript packages on every PR."
author: "Clerk"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  config-path:
    description: "Path to break-check.config.json, relative to the repository root."
    required: false
    default: "break-check.config.json"
  base-ref:
    description: |
      Git ref or commit SHA to compare against. Defaults to the pull request
      base SHA (`github.event.pull_request.base.sha`) so PRs are diffed
      against the exact commit they were opened against, not the moving tip
      of the base branch.
    required: false
    default: ${{ github.event.pull_request.base.sha || github.base_ref }}
  setup-command:
    description: |
      Shell command break-check runs inside both the base-ref checkout and the
      current checkout to install dependencies and build .d.ts files.
    required: false
    default: "pnpm install --frozen-lockfile && pnpm build"
  break-check-version:
    description: "Version of @clerk/break-check to fetch with `npx`."
    required: false
    default: "latest"
  comment:
    description: "Post (or update) a PR comment with the report."
    required: false
    default: "true"
  fail-on-breaking:
    description: "Fail the workflow when breaking changes are detected."
    required: false
    default: "false"
  github-token:
    description: "Token used to read existing comments and post the report."
    required: false
    default: ${{ github.token }}

outputs:
  has-breaking-changes:
    description: "true if break-check detected at least one breaking change."
    value: ${{ steps.detect.outputs.has-breaking-changes }}
  report-path:
    description: "Path to the generated markdown report."
    value: ${{ steps.detect.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Validate runtime context
      shell: bash
      run: |
        if [ -z "${BASE_REF:-}" ]; then
          echo "::error::base-ref is empty. Run this action on pull_request events, or pass base-ref explicitly."
          exit 1
        fi
        if [ ! -f "$CONFIG_PATH" ]; then
          echo "::error::config-path '$CONFIG_PATH' does not exist in the current checkout."
          exit 1
        fi
      env:
        BASE_REF: ${{ inputs.base-ref }}
        CONFIG_PATH: ${{ inputs.config-path }}

    - name: Snapshot baseline from ${{ inputs.base-ref }}
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        CONFIG_PATH: ${{ inputs.config-path }}
        SETUP_COMMAND: ${{ inputs.setup-command }}
        BREAK_CHECK_VERSION: ${{ inputs.break-check-version }}
      run: |
        set -euo pipefail
        BASELINE_DIR="$RUNNER_TEMP/break-check-baseline"
        BASE_CHECKOUT="$RUNNER_TEMP/break-check-base-checkout"
        rm -rf "$BASELINE_DIR" "$BASE_CHECKOUT"

        # base-ref may be a branch name ("main") or a commit SHA (the PR's
        # base.sha). We want the exact commit either way, not the current
        # tip of a moving branch. Resolve in two passes:
        #   1. If BASE_REF already names a reachable object locally (full
        #      clone + the SHA is in history, or a tracked branch tip is
        #      already updated), skip the fetch entirely. This is the
        #      common case when the caller used `actions/checkout` with
        #      `fetch-depth: 0` and `persist-credentials: false`, where a
        #      subsequent unauthenticated fetch would prompt for creds.
        #   2. Otherwise, fetch the ref and pin to FETCH_HEAD.
        if git rev-parse --verify --quiet "$BASE_REF^{commit}" > /dev/null; then
          BASE_TARGET="$BASE_REF"
        else
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_TARGET="FETCH_HEAD"
        fi
        git worktree add --detach "$BASE_CHECKOUT" "$BASE_TARGET"

        # If the base ref doesn't have a break-check config yet (e.g. the PR is the
        # one introducing break-check), seed it from the current checkout so the
        # first run still produces a usable baseline.
        if [ ! -f "$BASE_CHECKOUT/$CONFIG_PATH" ]; then
          mkdir -p "$BASE_CHECKOUT/$(dirname "$CONFIG_PATH")"
          cp "$CONFIG_PATH" "$BASE_CHECKOUT/$CONFIG_PATH"
        fi

        (
          cd "$BASE_CHECKOUT"
          bash -c "$SETUP_COMMAND"
          npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" snapshot \
            --config "$CONFIG_PATH" \
            --output "$BASELINE_DIR"
        )

        echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
        echo "BASE_CHECKOUT=$BASE_CHECKOUT" >> "$GITHUB_ENV"

    - name: Build current checkout
      shell: bash
      env:
        SETUP_COMMAND: ${{ inputs.setup-command }}
      run: bash -c "$SETUP_COMMAND"

    - name: Detect API changes
      id: detect
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        BREAK_CHECK_VERSION: ${{ inputs.break-check-version }}
        FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
      run: |
        set -uo pipefail
        REPORT_PATH="$RUNNER_TEMP/break-check-report.md"
        JSON_PATH="$RUNNER_TEMP/break-check-report.json"

        detect_md() {
          npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" detect \
            --config "$CONFIG_PATH" \
            --baseline "$BASELINE_DIR" \
            --output "$REPORT_PATH"
        }

        # detect exits 3 when it refuses the baseline as incompatible with this
        # break-check (API Extractor major or discovery version mismatch). Rebuild the
        # baseline from the base ref with this break-check so both sides match, then
        # retry once. This recovers when the baseline came from a different
        # break-check (a cached or committed baseline); when it was just produced
        # fresh at the same version the rebuild is identical, so a persistent
        # exit 3 surfaces as a clear error below.
        status=0
        detect_md || status=$?
        if [ "$status" = "3" ]; then
          echo "::notice::break-check refused the baseline as incompatible; rebuilding it from the base ref with this break-check and retrying."
          rm -rf "$BASELINE_DIR"
          (
            cd "$BASE_CHECKOUT"
            npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" snapshot \
              --config "$CONFIG_PATH" \
              --output "$BASELINE_DIR"
          )
          status=0
          detect_md || status=$?
        fi
        if [ "$status" = "3" ]; then
          echo "::error::break-check refused the baseline as incompatible even after rebuilding it from the base ref. The snapshot-time and detect-time break-check versions likely differ; pin a single break-check-version."
          exit 1
        fi
        if [ "$status" != "0" ]; then
          echo "::error::break-check detect failed (exit $status)."
          exit "$status"
        fi

        # Baseline is now compatible; the JSON pass reuses it (best-effort).
        npx --yes "@clerk/break-check@$BREAK_CHECK_VERSION" detect \
          --config "$CONFIG_PATH" \
          --baseline "$BASELINE_DIR" \
          --format json > "$JSON_PATH" || true

        HAS_BREAKING=false
        if [ -f "$JSON_PATH" ]; then
          HAS_BREAKING=$(node -e "
            const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf-8'));
            process.stdout.write(r.hasBreakingChanges ? 'true' : 'false');
          " "$JSON_PATH" 2>/dev/null || echo false)
        fi

        echo "has-breaking-changes=$HAS_BREAKING" >> "$GITHUB_OUTPUT"
        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

        if [ "$FAIL_ON_BREAKING" = "true" ] && [ "$HAS_BREAKING" = "true" ]; then
          echo "::error::Breaking API changes detected."
          exit 1
        fi

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const reportPath = '${{ steps.detect.outputs.report-path }}';
          if (!fs.existsSync(reportPath)) {
            core.warning(`break-check report not found at ${reportPath}; skipping comment.`);
            return;
          }
          const marker = '<!-- break-check-action -->';
          const body = `${marker}\n${fs.readFileSync(reportPath, 'utf-8')}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
