name: Lint

# Static linting for CI plumbing. actionlint covers the workflow files (and runs
# shellcheck over their `run:` blocks); a second job shellchecks the composite
# Action's embedded shell, which actionlint does not cover. Both are fast,
# need no secrets, and run least-privilege.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run actionlint
        # Pin the release by version + sha256 rather than a moving action so the
        # binary is reproducible and tamper-evident. shellcheck is preinstalled on
        # ubuntu runners, so actionlint also lints the workflows' shell.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color

  action-pins:
    name: actions pinned to SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Pure-stdlib Node script; the runner's preinstalled node is enough (no
      # setup-node / install needed), keeping this gate fast.
      - run: node scripts/check-action-pins.mjs

  action-shell:
    name: action.yml shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # shellcheck is preinstalled on ubuntu runners; the script fails loudly if
      # it is ever absent rather than silently passing.
      - run: pnpm lint:actions
