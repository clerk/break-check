name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Persisted credentials are intentionally kept on this checkout so the
      # subsequent `changesets/action` step can push the Version PR branch back
      # to the repo. Prefer CHANGESETS_PAT so that push is attributed to a real
      # token rather than GITHUB_TOKEN: GitHub does not run Actions workflows on
      # commits/PRs created by GITHUB_TOKEN, so without a PAT the "Version
      # Packages" PR never triggers CI and sits blocked under branch protection.
      # Falls back to GITHUB_TOKEN until the secret is provisioned, so this is
      # safe to merge before the secret exists (releases keep working; the
      # version PR just won't run CI until the PAT is added).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # Use `pnpm run <script>`, not `pnpm <script>`. `pnpm version`
          # resolves to pnpm's built-in version command (which demands a
          # semver argument and exits non-zero here), shadowing the
          # package.json "version" script. `release` has no such collision
          # today, but spelling both as `run` removes the footgun.
          publish: pnpm run release
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Same CHANGESETS_PAT-with-fallback as the checkout above, so the
          # Version PR is opened/updated by that identity and triggers the
          # required CI checks instead of silently skipping them.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT || secrets.GITHUB_TOKEN }}

      # Consumers pin the composite Action as `clerk/break-check@v1`, a moving
      # tag that must track the latest release. It used to be moved by hand
      # after each publish, which predictably got skipped (v1 sat one release
      # behind after 0.1.2). Move it here, on the same commit changesets just
      # published from, so it can never drift again. A lightweight forced tag
      # is intentional: the tag is a pointer, not a release artifact (the
      # semver tag changesets creates is the durable one). NOTE: `v1` names
      # the Action's INTERFACE major, decoupled from the npm version. If
      # action.yml's inputs/outputs ever change incompatibly, freeze this at
      # the last compatible commit and start pushing `v2` instead.
      - name: Move the v1 Action tag to the release commit
        if: steps.changesets.outputs.published == 'true'
        run: |
          git tag --force v1
          git push --force origin v1
