name: Publish Preview

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"
          - "26"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: pnpm check
        env:
          # Only pass the AI key on a single Node version so a flaky API call
          # can't take down the whole matrix and so we don't pay 3x.
          SNAPI_ANTHROPIC_API_KEY: ${{ matrix.node-version == '24' && secrets.SNAPI_ANTHROPIC_API_KEY || '' }}
        run: pnpm check

      - name: Verify changeset is present
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
