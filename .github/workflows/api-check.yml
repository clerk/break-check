name: API Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Snapshot baseline from base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Use the PR's base SHA so we diff against the exact commit the PR
          # was opened against, not the moving tip of the base branch. The
          # checkout above uses fetch-depth: 0 + persist-credentials: false,
          # so the SHA is already in local history and a fresh fetch would
          # fail without auth; check out directly.
          git worktree add --detach /tmp/base-checkout "$BASE_SHA"
          # Bring the PR's snapi.config.json over so first-run PRs (where the
          # base branch doesn't yet have one) can still produce a baseline.
          # If the base already has a config, cp -n leaves it untouched.
          cp -n snapi.config.json /tmp/base-checkout/snapi.config.json || true
          cd /tmp/base-checkout
          pnpm install --frozen-lockfile
          pnpm build
          node dist/cli.js snapshot --output "$GITHUB_WORKSPACE/.api-baseline-main"

      - name: Install and build PR
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Detect API changes
        id: detect
        env:
          SNAPI_ANTHROPIC_API_KEY: ${{ secrets.SNAPI_ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          set -uo pipefail
          run_detect() {
            node dist/cli.js detect --baseline .api-baseline-main --output api-report.md
          }

          # The baseline above is produced by the BASE ref's snapi, while this
          # step runs the PR's snapi. When the PR changes producer semantics
          # (API Extractor major, discovery version), detect refuses the
          # baseline with exit code 3. That's expected here; rebuild the
          # baseline with the current build (against the already-built base
          # checkout) so both sides match, then retry once.
          status=0
          run_detect || status=$?
          if [ "$status" = "3" ]; then
            echo "::notice::Baseline was produced by a different snapi (producer/discovery mismatch); rebuilding it with the current build and retrying."
            # --output is resolved relative to the --config dir, so it must be
            # absolute to land back in the workspace where detect reads it.
            rm -rf "$GITHUB_WORKSPACE/.api-baseline-main"
            node dist/cli.js snapshot \
              --config /tmp/base-checkout/snapi.config.json \
              --output "$GITHUB_WORKSPACE/.api-baseline-main"
            status=0
            run_detect || status=$?
          fi
          exit "$status"

      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- snapi-self-dogfood -->';
            if (!fs.existsSync('api-report.md')) {
              core.warning('snapi report not found (detect failed); skipping comment.');
              return;
            }
            const report = fs.readFileSync('api-report.md', 'utf-8');
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
